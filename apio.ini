; FPGA Synthesizer — Nandland Go Board and IceSugar-Pro
; See https://fpgawars.github.io/apio/docs/project-file for details.

[apio]
default-env = go-board

[common]
top-module = SynthTop

[env:go-board]
board = go-board
constraint-file = go-board.pcf
top-module = SynthTop

; IceSugar-Pro SRAM (fast, lost on power-cycle)
;   apio upload -e icesugar-pro-ram
[env:icesugar-pro-ram]
board = icesugar-pro-ram
constraint-file = icesugar-pro.lpf
top-module = icesugar_top

; IceSugar-Pro SPI flash (persists)
;   apio upload -e icesugar-pro
[env:icesugar-pro]
board = icesugar-pro
constraint-file = icesugar-pro.lpf
top-module = icesugar_top
